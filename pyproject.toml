[build-system]
requires =["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"


[project]
name = "minitorch"
version = "0.1.0"
description = "Principles and Components of building Artificial Intelligent Systems."
readme = "README.md"
requires-python = ">=3.13.3"
dependencies = [
    "numpy>=2.5.4",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "torch>=2.14.1",
]

[tools.setuptools]
package-dir ={"" = "src"}

[tools.setuptools.packages.find]
where = ["src"]
